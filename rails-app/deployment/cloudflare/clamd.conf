# Root-owned immutable config; scanner TCP is loopback only and never published.
Foreground yes
User rails
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /var/tmp/clamav
TCPSocket 3310
TCPAddr 127.0.0.1
OfficialDatabaseOnly yes
FailIfCvdOlderThan 2
SelfCheck 60
ConcurrentDatabaseReload no
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 4
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 1000
MaxScanTime 12000
ReadTimeout 10
CommandReadTimeout 5
SendBufTimeout 200
ScanPDF yes
ScanArchive yes
HeuristicAlerts yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo no
