DatabaseDirectory /var/lib/clamav
DatabaseOwner rails
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
ScriptedUpdates yes
TestDatabases yes
Checks 12
MaxAttempts 2
ConnectTimeout 10
ReceiveTimeout 30
LogTime yes
LogVerbose no
