default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
<% if ENV["TEST_DATABASE_URL"].to_s.empty? %>
  <<: *default
  database: storage/test.sqlite3
<% else %>
  adapter: postgresql
  url: <%= ENV.fetch("TEST_DATABASE_URL").inspect %>
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
<% end %>

production:
  adapter: postgresql
<% unless ENV["DATABASE_URL"].to_s.empty? %>
  url: <%= ENV.fetch("DATABASE_URL").inspect %>
<% end %>
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  connect_timeout: 5
  sslmode: <%= ENV.fetch("DB_SSLMODE", "require").inspect %>
  variables:
    statement_timeout: <%= ENV.fetch("DB_STATEMENT_TIMEOUT", 15000) %>
