title: ISP backup export reader
description: Read ISP authentication recovery data and start/read Firestore exports; no account changes or data import.
stage: GA
includedPermissions:
  - firebaseauth.users.get
  - firebaseauth.configs.get
  - firebaseauth.configs.getHashConfig
  - datastore.databases.get
  - datastore.databases.export
  - datastore.operations.get
